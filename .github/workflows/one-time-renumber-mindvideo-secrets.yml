name: One-time MindVideo secret renumber

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: "copy #15 and #21 to their new slots"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy secrets without exposing their values
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          SOURCE_TOKEN15: ${{ secrets.MINDVIDEO_TOKEN15 }}
          SOURCE_TOKEN21: ${{ secrets.MINDVIDEO_TOKEN21 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "GH_SECRETS_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$SOURCE_TOKEN15" ] || [ -z "$SOURCE_TOKEN21" ]; then
            echo "One or more source secrets is empty."
            exit 1
          fi

          printf '%s' "$SOURCE_TOKEN15" | gh secret set MINDVIDEO_TOKEN12 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$SOURCE_TOKEN21" | gh secret set MINDVIDEO_TOKEN13 --repo "$GITHUB_REPOSITORY"
          echo "Target secrets MINDVIDEO_TOKEN12 and MINDVIDEO_TOKEN13 were created."
