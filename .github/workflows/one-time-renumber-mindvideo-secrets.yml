name: One-time MindVideo secret renumber

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: "copy #4 and #6-#11 to #1-#7"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy secrets without exposing their values
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          SOURCE_TOKEN4: ${{ secrets.MINDVIDEO_TOKEN4 }}
          SOURCE_TOKEN6: ${{ secrets.MINDVIDEO_TOKEN6 }}
          SOURCE_TOKEN7: ${{ secrets.MINDVIDEO_TOKEN7 }}
          SOURCE_TOKEN8: ${{ secrets.MINDVIDEO_TOKEN8 }}
          SOURCE_TOKEN9: ${{ secrets.MINDVIDEO_TOKEN9 }}
          SOURCE_TOKEN10: ${{ secrets.MINDVIDEO_TOKEN10 }}
          SOURCE_TOKEN11: ${{ secrets.MINDVIDEO_TOKEN11 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "GH_SECRETS_TOKEN is not configured."
            exit 1
          fi
          for source in "$SOURCE_TOKEN4" "$SOURCE_TOKEN6" "$SOURCE_TOKEN7" "$SOURCE_TOKEN8" "$SOURCE_TOKEN9" "$SOURCE_TOKEN10" "$SOURCE_TOKEN11"; do
            if [ -z "$source" ]; then
              echo "One or more source secrets is empty."
              exit 1
            fi
          done

          # Capture all source values in the job environment before overwriting
          # the reused target names (#4, #6, and #7).
          printf '%s' "$SOURCE_TOKEN4" | gh secret set MINDVIDEO_TOKEN1 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$SOURCE_TOKEN6" | gh secret set MINDVIDEO_TOKEN2 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$SOURCE_TOKEN7" | gh secret set MINDVIDEO_TOKEN3 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$SOURCE_TOKEN8" | gh secret set MINDVIDEO_TOKEN4 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$SOURCE_TOKEN9" | gh secret set MINDVIDEO_TOKEN5 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$SOURCE_TOKEN10" | gh secret set MINDVIDEO_TOKEN6 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$SOURCE_TOKEN11" | gh secret set MINDVIDEO_TOKEN7 --repo "$GITHUB_REPOSITORY"
          echo "Target secrets MINDVIDEO_TOKEN1 through MINDVIDEO_TOKEN7 were created."
