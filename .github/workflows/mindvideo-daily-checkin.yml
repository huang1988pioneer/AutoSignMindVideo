name: MindVideo Daily Check-in

on:
  schedule:
    # Asia/Taipei 05:09–06:09 window (9 minutes after AutoSignLitVideo).
    - cron: "9 21 * * *"
    # Asia/Taipei 08:09–09:09 window (9 minutes after the hour).
    - cron: "9 0 * * *"
    # Asia/Taipei 11:09–12:09 window (9 minutes after the hour).
    - cron: "9 3 * * *"
    # Asia/Taipei 13:09–14:09 window (9 minutes after AutoSignLitVideo).
    - cron: "9 5 * * *"
    # Asia/Taipei 21:09–22:09 window (9 minutes after AutoSignLitVideo).
    - cron: "9 13 * * *"
  workflow_dispatch:

concurrency:
  group: mindvideo-daily-checkin
  cancel-in-progress: false

jobs:
  define-matrix:
    name: load enabled account matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.accounts.outputs.matrix }}
      count: ${{ steps.accounts.outputs.count }}
      max_parallel: ${{ steps.accounts.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and emit account matrix
        id: accounts
        run: node scripts/emit-account-matrix.mjs

  checkin:
    needs: define-matrix
    # Job names use the labels from accounts.json, e.g. checkin-1-goldshoot0720.
    name: checkin-${{ matrix.account }}-${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 21 * * *' || github.event.schedule == '9 0 * * *' || github.event.schedule == '9 3 * * *' || github.event.schedule == '9 5 * * *' || github.event.schedule == '9 13 * * *'
    runs-on: ubuntu-latest
    # The last enabled account can wait up to (enabled count - 1) × 15s.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.define-matrix.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run MindVideo check-in
        env:
          MINDVIDEO_ACCOUNT: ${{ matrix.account }}
          MINDVIDEO_ACCOUNT_LABEL: ${{ matrix.label }}
          MINDVIDEO_STAGGER_INDEX: ${{ matrix.position }}
          MINDVIDEO_SECRET_NAME: MINDVIDEO_TOKEN${{ matrix.account }}
          MINDVIDEO_TOKEN: ${{ secrets[format('MINDVIDEO_TOKEN{0}', matrix.account)] }}
          MINDVIDEO_LANG: zh-TW
          MINDVIDEO_RESULT_DIR: artifacts
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          mkdir -p artifacts

          if [ -z "$MINDVIDEO_TOKEN" ]; then
            echo "$MINDVIDEO_SECRET_NAME ($MINDVIDEO_ACCOUNT_LABEL) is not configured; writing skipped result."
            export MINDVIDEO_RESULT_STATUS=skipped
            export MINDVIDEO_RESULT_MESSAGE="token not configured"
            node scripts/write-checkin-result.mjs
            exit 0
          fi

          # Every matrix job uses the same seed and active-account position.
          export MINDVIDEO_STAGGER_MS="$(node scripts/stagger-delay.mjs)"
          echo "Stagger: ${MINDVIDEO_STAGGER_MS}ms (sequential 5–15s after previous enabled account)"

          # Always keep a result artifact even when check-in exits non-zero.
          set +e
          npm run checkin
          code=$?
          set -e

          if [ ! -f artifacts/checkin-result.json ]; then
            export MINDVIDEO_RESULT_STATUS=failed
            export MINDVIDEO_RESULT_MESSAGE="check-in exited without writing result artifact"
            node scripts/write-checkin-result.mjs
          fi

          exit "$code"
      - name: Upload account result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-result-${{ matrix.account }}-${{ matrix.label }}
          path: artifacts/checkin-result.json
          if-no-files-found: warn
          retention-days: 14

  daily-summary:
    name: daily-summary
    needs:
      - define-matrix
      - checkin
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download all account results
        uses: actions/download-artifact@v4
        with:
          pattern: checkin-result-*
          path: collected
          merge-multiple: false
      - name: Build daily summary (Job Summary)
        env:
          MINDVIDEO_SUMMARY_DIR: artifacts
          MINDVIDEO_EXPECTED_ACCOUNTS: ${{ needs.define-matrix.outputs.count }}
        run: |
          # Writes LitMedia-style markdown to GITHUB_STEP_SUMMARY + artifacts/.
          npm run summary -- collected
          echo "----- preview -----"
          if [ -f artifacts/checkin-daily-summary.md ]; then
            cat artifacts/checkin-daily-summary.md
          else
            echo "summary markdown missing"
            exit 1
          fi
      - name: Upload daily summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindvideo-checkin-report
          path: |
            artifacts/checkin-daily-summary.md
            artifacts/checkin-daily-summary.json
            artifacts/checkin-streaks.json
          if-no-files-found: warn
          retention-days: 30
